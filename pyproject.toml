[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uzbek-text-guard"
version = "0.1.0"
description = "Uzbek Latin text & apostrophe guard (2026 standard) for CI and pre-commit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
uzbek-text-guard = "uzbek_text_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
